:root {

  --v1: #ff8a5c; --v2: #2997ff; --sp: #f5f5f7; --accent: #2997ff; --accent-soft: rgba(41, 151, 255, .14);
  --good: #30d158; --good-bg: rgba(48, 209, 88, .16); --bad: #ff9f6e; --bad-bg: rgba(255, 138, 92, .16);

/* -- draga inn ------------------------------------------------------------ */

<script>
"use strict";
// ---------------------------------------------------------------- gögn
const EMB = JSON.parse(document.getElementById("embedded-data").textContent);
let state = { files: {}, label: "", real: false, tab: "p1", showSettle: false, showMeas: true };

function loadEmbedded() {
  state.files = {};
  Object.entries(EMB.files || {}).forEach(([n, txt]) => state.files[canonicalName(n, txt)] = txt);
  state.label = EMB.label || "";
  state.real = !!EMB.real;
  state.dropped = false;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(",").map(s => s.trim());
  return lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(","); const o = {};
    head.forEach((h, i) => { const v = (c[i] ?? "").trim(); o[h] = v === "" ? null : (isNaN(+v) ? v : +v); });
    return o;
  });
}

function runData(part, v) {
  const txt = state.files[`part${part}_${v}.csv`];
  if (!txt) return null;
  const rows = parseCSV(txt);
  const run = rows.filter(r => r.phase === "run");
  if (!run.length) return null;
  const t0abs = run[0].t_abs - run[0].t;
  return { all: rows.map(r => ({ ...r, tt: r.t_abs - t0abs })), run };
}

function design(part, v) {
  const txt = state.files[`part${part}_${v}_design.json`];
  try { return txt ? JSON.parse(txt) : null; } catch { return null; }
}

// ---------------------------------------------------------------- mælikvarðar (sama og analyze.py)
const BAND = 0.5;
function segments(part) {
  if (part === 1) return [["hold", 0, 240]];
  return [["hold", 0, 180], ["ramp", 180, 300], ["hold", 300, 480], ["ramp", 480, 600], ["hold", 600, 780]];
}
const mean = a => a.reduce((s, x) => s + x, 0) / (a.length || NaN);
function settling(ts, es) {
  let last = -1;
  es.forEach((e, i) => { if (Math.abs(e) >= BAND) last = i; });
  if (last < 0) return 0;
  if (last === es.length - 1) return NaN;
  return ts[last + 1];
}
function metrics(part, run) {
  const t = run.map(r => r.t), r = run.map(x => x.r), y = run.map(x => x.y), u = run.map(x => x.u);
  const e = r.map((ri, i) => ri - y[i]);
  const du = u.slice(1).map((x, i) => x - u[i]);
  let iae = 0; for (let i = 1; i < t.length; i++) iae += Math.abs(e[i]) * (t[i] - t[i - 1]);
  const mdu = mean(du);
  const m = [
    ["IAE", "°C·s", iae, "Heildarskekkja yfir keyrsluna"],
    ["RMS e", "°C", Math.sqrt(mean(e.map(x => x * x))), "Kvaðratmeðaltal skekkju"],
    ["max |e|", "°C", Math.max(...e.map(Math.abs)), "Mesta frávik frá óskgildi"],
    ["TV(u)", "%", du.reduce((s, x) => s + Math.abs(x), 0), "Heildarbreytileiki stýrimerkis (slit á viftu)"],
    ["std(Δu)", "%", Math.sqrt(mean(du.map(x => (x - mdu) ** 2))), "Flökt stýrimerkis milli sýna"],
    ["meðal u", "%", mean(u), "Meðal duty cycle", "neutral"],
  ];
  const segs = segments(part);
  const names = { hold: "fast", ramp: "rampur" };
  segs.forEach(([kind, t0, t1], i) => {
    const idx = t.map((ti, k) => (ti >= t0 && ti < t1) ? k : -1).filter(k => k >= 0);
    if (!idx.length) return;
    const lab = `${kind === "hold" ? "H" : "R"}${i + 1}`;
    const span = `${t0}–${t1} s, ${names[kind]}`;
    if (kind === "hold") {
      const tail = idx.filter(k => t[k] >= t1 - 60);
      m.push([`e_ss ${lab}`, "°C", mean(tail.map(k => e[k])), `Skekkja í jafnvægi, síðustu 60 s (${span})`]);
      if (part > 1 && i > 0) {
        m.push([`t_s ${lab}`, "s", settling(idx.map(k => t[k] - t0), idx.map(k => e[k])), `Aðlögunartími að ±${BAND} °C (${span})`]);
        const prev = segs[i - 1];
        const kPrev = t.findIndex(ti => ti >= prev[1]);
        const dir = Math.sign(r[idx[0]] - r[Math.max(kPrev, 0)]);
        const os = Math.max(0, ...idx.map(k => dir * (y[k] - r[k])));
        m.push([`yfirskot ${lab}`, "°C", os, `Mesta frávik handan óskgildis eftir ramp (${span})`]);
      }
    } else {
      m.push([`meðal e ${lab}`, "°C", mean(idx.map(k => e[k])), `Meðalskekkja / eftirdragi í rampi (${span})`]);
    }
  });
  if (part === 1) m.push(["t_s", "s", settling(t, e), `Aðlögunartími að ±${BAND} °C`]);
  return m;
}
function change(a, b, unit) {
  const A = Math.abs(a), B = Math.abs(b);
  if (!isFinite(A) || !isFinite(B) || A < 1e-3) return null;
  // prósentur af nær-núll skekkju (< 0.05 °C, undir upplausn nemans) segja ekkert
  if (unit === "°C" && Math.max(A, B) < 0.05) return null;
  return 100 * (B - A) / A;
}
const fmt = (x, d = 2) => (x === null || x === undefined || !isFinite(x)) ? "–" : x.toFixed(d);

// ---------------------------------------------------------------- graf (SVG)
function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) hi = lo + 1;
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw);
  const out = []; for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function lineChart(el, cfg) {
  el.innerHTML = "";
  const W = Math.max(300, el.clientWidth || 800), H = cfg.height || 300;
  const m = { l: 40, r: 8, t: cfg.bandLabels ? 22 : 10, b: 26 };
  const xs = [], ys = [];
  cfg.series.forEach(s => s.pts.forEach(([x, y]) => { if (isFinite(x) && isFinite(y)) { xs.push(x); ys.push(y); } }));
  if (!xs.length) { el.innerHTML = '<p class="note">Engin gögn</p>'; return; }
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = cfg.yMin ?? Math.min(...ys), y1 = cfg.yMax ?? Math.max(...ys);
  const pad = (y1 - y0) * .08 || .5; if (cfg.yMin === undefined) y0 -= pad; if (cfg.yMax === undefined) y1 += pad;
  const yt = niceTicks(y0, y1, cfg.yTicks || 5).filter(v => v >= y0 - 1e-9 && v <= y1 + 1e-9);
  const xt = niceTicks(x0, x1, W < 560 ? 4 : 8).filter(v => v >= x0 && v <= x1);
  const sx = x => m.l + (x - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
  const sy = y => H - m.b - (y - y0) / (y1 - y0 || 1) * (H - m.t - m.b);
  let s = "";
  (cfg.bands || []).forEach(b => {
    const a = Math.max(b[0], x0), c = Math.min(b[1], x1); if (c <= a) return;
    s += `<rect class="band" x="${sx(a)}" y="${m.t}" width="${sx(c) - sx(a)}" height="${H - m.t - m.b}"/>`;
    if (cfg.bandLabels && b[2]) s += `<text class="bandlbl" x="${(sx(a) + sx(c)) / 2}" y="${m.t - 7}" text-anchor="middle">${b[2]}</text>`;
  });
  yt.forEach(v => { s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${m.l - 8}" y="${sy(v) + 4}" text-anchor="end">${+v.toFixed(2)}</text>`; });
  xt.forEach(v => { s += `<text x="${sx(v)}" y="${H - 6}" text-anchor="middle">${+v.toFixed(1)}${v === xt[xt.length - 1] && cfg.xUnit ? " " + cfg.xUnit : ""}</text>`; });
  cfg.series.forEach(se => {
    const pts = se.pts.filter(([x, y]) => isFinite(x) && isFinite(y)); if (!pts.length) return;
    let d = "";
    if (se.step) pts.forEach(([x, y], i) => { d += i ? `H${sx(x).toFixed(1)}V${sy(y).toFixed(1)}` : `M${sx(x).toFixed(1)},${sy(y).toFixed(1)}`; });
    else d = "M" + pts.map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join("L");
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ""} opacity="${se.opacity ?? 1}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (se.endDot) { const [ex, ey] = pts[pts.length - 1]; s += `<circle cx="${sx(ex)}" cy="${sy(ey)}" r="3.5" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`; }
  });
  s += `<g id="hov" visibility="hidden"><line class="cross" id="cross" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}"/>`;
  cfg.series.forEach((se, i) => { if (se.tip !== false) s += `<circle id="hd${i}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  s += `</g>`;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", cfg.aria || "Graf");
  svg.innerHTML = s; el.appendChild(svg);
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; el.appendChild(tip);
  const hov = svg.querySelector("#hov"), cross = svg.querySelector("#cross");
  const nearest = (pts, x) => { let lo = 0, hi = pts.length - 1; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (pts[mid][0] < x) lo = mid; else hi = mid; } return Math.abs(pts[lo][0] - x) < Math.abs(pts[hi][0] - x) ? pts[lo] : pts[hi]; };
  function move(ev) {
    const rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) / rect.width * W;
    if (px < m.l || px > W - m.r) return leave();
    const x = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); hov.setAttribute("visibility", "visible");
    let h = `<b>${cfg.xName || "t"} = ${x.toFixed(0)}${cfg.xUnit ? " " + cfg.xUnit : ""}</b>`;
    cfg.series.forEach((se, i) => {
      if (se.tip === false || !se.pts.length) return;
      const p = nearest(se.pts, x), dot = svg.querySelector("#hd" + i);
      dot.setAttribute("cx", sx(p[0])); dot.setAttribute("cy", sy(p[1]));
      h += `<div class="r"><span><span class="vdot" style="background:${se.color}"></span>${se.name}</span><span>${fmt(p[1], cfg.tipDigits ?? 2)}${cfg.unit || ""}</span></div>`;
    });
    tip.innerHTML = h; tip.hidden = false;
    const left = (px / W) * rect.width;
    tip.style.left = (left > rect.width / 2 ? left - tip.offsetWidth - 14 : left + 14) + "px";
    tip.style.top = "6px";
  }
  function leave() { tip.hidden = true; hov.setAttribute("visibility", "hidden"); }
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move); svg.addEventListener("pointerleave", leave);
}

// ---------------------------------------------------------------- uppsetning
const TABS = [
  ["eq", "Jafnvægi", () => !!state.files["step1_equilibrium.csv"]],
  ["fan", "Vifta", () => fanTests().length > 0],
  ["p1", "Liður 1", () => runData(1, "v1") || runData(1, "v2")],
  ["p2", "Liður 2", () => runData(2, "v1") || runData(2, "v2")],
  ["p3", "Liður 3", () => runData(3, "v1") || runData(3, "v2")],
];
const DESC = {
  1: ["Halda föstu óskgildi", "Óskgildið er jafnvægishitastigið við 50% duty cycle. Því er haldið óbreyttu í 240 sekúndur."],
  2: ["Fylgja breytingum í óskgildi", "Hitinn fylgir óskgildi sem hækkar línulega úr T50 í T20 og lækkar svo í T80, með 180 sekúndna kyrrstöðu á milli."],
  3: ["Fylgja óskgildi þrátt fyrir truflun", "Sami ferill og í lið 2, en sínustruflun með útslag 3% af |T20 − T80| og 8 sekúndna sveiflutíma er bætt við mælinguna."],
};
const VN = { v1: "Upprunaleg", v2: "Endurbætt" };
const KPI = [["IAE", "Heildarskekkja", 1], ["RMS e", "RMS skekkja", 3], ["max |e|", "Mesta frávik", 2], ["TV(u)", "Breytileiki stýrimerkis", 0]];

const THEMES = [["light", "Ljóst"], ["dark", "Dökkt"], ["auto", "Kerfi"]];
function applyTheme(t) {
  const r = document.documentElement;
  if (t === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
  state.theme = t;
  try { localStorage.setItem("theme", t); } catch {}
}
function renderTheme() {
  const g = document.getElementById("theme"); g.innerHTML = "";
  THEMES.forEach(([id, name]) => {
    const b = document.createElement("button"); b.textContent = name; b.setAttribute("role", "radio");
    b.setAttribute("aria-selected", state.theme === id); b.setAttribute("aria-checked", state.theme === id);
    b.onclick = () => { applyTheme(id); renderTheme(); render(); };
    g.appendChild(b);
  });
}
function renderTabs() {
  const nav = document.getElementById("tabs"); nav.innerHTML = "";
  TABS.forEach(([id, name, has]) => {
    const b = document.createElement("button"); b.setAttribute("role", "tab"); b.id = "tab-" + id;
    b.setAttribute("aria-selected", state.tab === id);
    b.innerHTML = has() ? name : `<span class="na">${name}</span>`;
    b.onclick = () => { state.tab = id; try { localStorage.setItem("tab", id); } catch {} render(); window.scrollTo({ top: 0 }); };
    nav.appendChild(b);
  });
}
function sourceLine() {
  const kind = state.dropped ? "Innlesnar skrár" : state.real ? "Mælingar af búnaði" : "Sýnigögn úr hermi";
  return `<div class="meta"><span class="badge ${state.real ? "real" : ""}">${kind}</span><span class="mono">${state.label}</span>${state.dropped || state.real ? "" : '<span>Hlaðið inn ykkar eigin gögnum til að skoða raunmælingar.</span>'}${state.dropped ? '<button class="link" id="back">Aftur í innbyggð gögn</button>' : ""}</div>`;
}
function chip(c) {
  if (c === null) return "";
  const cls = c < -1 ? "good" : c > 1 ? "bad" : "neutral";
  const arrow = c < -1 ? "↓" : c > 1 ? "↑" : "";
  return `<span class="chg ${cls}">${arrow} ${Math.abs(c).toFixed(0)}%</span>`;
}

function render() {
  renderTabs();
  const p = document.getElementById("panel");
  if (state.tab === "eq") renderEq(p); else if (state.tab === "fan") renderFan(p); else renderPart(p, +state.tab.slice(1));
  const back = document.getElementById("back");
  if (back) back.onclick = () => { loadEmbedded(); render(); };
  p.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => document.getElementById("file").click());
}

function emptyState(title, text) {
  return `<div class="empty"><h3>${title}</h3><p class="note" style="margin:0">${text}</p><button class="btn" data-pick>Hlaða inn gögnum</button></div>`;
}

function renderPart(p, part) {
  const runs = { v1: runData(part, "v1"), v2: runData(part, "v2") };
  const [title, desc] = DESC[part];
  const hero = `<section class="hero"><span class="eyebrow">Liður ${part}</span><h1>${title}</h1><p>${desc}</p>${sourceLine()}</section>`;
  if (!runs.v1 && !runs.v2) {
    p.innerHTML = hero + emptyState(`Engin gögn fyrir lið ${part}`, `Hlaðið inn <span class="mono">part${part}_v1.csv</span> og <span class="mono">part${part}_v2.csv</span> úr <span class="mono">data/</span> möppunni.`);
    return;
  }
  const vers = ["v1", "v2"].filter(v => runs[v]), both = vers.length === 2;
  const ms = {}; vers.forEach(v => ms[v] = metrics(part, runs[v].run));
  const get = (v, k) => ms[v].find(x => x[0] === k);
  const C = { v1: css("--v1"), v2: css("--v2"), sp: css("--sp") };

  const kpis = KPI.map(([k, name, dig]) => {
    const main = vers[vers.length - 1], other = both ? "v1" : null, row = get(main, k);
    const c = both ? change(get("v1", k)[2], get("v2", k)[2], row[1]) : null;
    return `<div class="kpi"><span class="k">${name}</span>
      <span class="big">${fmt(row[2], dig)}<small>${row[1]}</small></span>
      <span class="sub"><span class="vdot" style="background:${C[main]}"></span>${VN[main]}${other ? ` · upprunaleg ${fmt(get(other, k)[2], dig)}` : ""}</span>
      <div class="foot"><span class="sub">${k}</span>${chip(c)}</div></div>`;
  }).join("");

  let rows = "", lastGrp = "";
  ms[vers[0]].forEach((x, i) => {
    const grp = /^(IAE|RMS|max|TV|std|meðal u)/.test(x[0]) ? "Heildin" : "Eftir bútum";
    if (grp !== lastGrp) { rows += `<tr class="grp"><td colspan="${3 + vers.length}">${grp}</td></tr>`; lastGrp = grp; }
    const vals = vers.map(v => `<td class="num">${fmt(ms[v][i][2], x[1] === "s" || x[0] === "TV(u)" ? 1 : 3)}</td>`).join("");
    const ch = both && x[4] !== "neutral" ? change(ms.v1[i][2], ms.v2[i][2], x[1]) : null;
    rows += `<tr><td class="name">${x[0]}<span class="hint">${x[3]}</span></td><td class="num" style="color:var(--muted)">${x[1]}</td>${vals}${both ? `<td class="num">${ch === null ? '<span style="color:var(--faint)">–</span>' : chip(ch)}</td>` : ""}</tr>`;
  });

  const dz = vers.map(v => { const d = design(part, v); return d ? `<tr><td class="name"><span class="vdot" style="background:${C[v]}"></span>${VN[v]}<span class="hint">${d.description || ""}</span></td><td class="num">${fmt(d.kc, 2)}</td><td class="num">${fmt(d.ti, 1)}</td><td class="num">${fmt(d.tc, 1)}</td><td class="num">${fmt(d.theta_eff, 1)}</td><td class="num">${fmt(d.preview, 1)}</td></tr>` : ""; }).join("");

  p.innerHTML = hero + `
    <div class="kpis">${kpis}</div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="cb-settle" ${state.showSettle ? "checked" : ""}><span class="switch"></span>Sýna aðlögun fyrir t = 0</label>
      ${part === 3 ? `<label class="toggle"><input type="checkbox" id="cb-meas" ${state.showMeas ? "checked" : ""}><span class="switch"></span>Sýna mælingu með truflun</label>` : ""}
    </div>
    <div class="card"><div class="card-head"><h3>Hitastig</h3><div class="legend" id="lg-T"></div></div><div class="chart" id="ch-T"></div></div>
    <div class="card"><div class="card-head"><h3>Stýrimerki</h3><span class="cap">Duty cycle viftu, 0–100%</span></div><div class="chart" id="ch-u"></div></div>
    <h2 class="section-title">Mælikvarðar</h2>
    <div class="tablecard"><table>
      <thead><tr><th>Mælikvarði</th><th class="num">Eining</th>${vers.map(v => `<th class="num"><span class="vdot" style="background:${C[v]}"></span>${VN[v]}</th>`).join("")}${both ? '<th class="num">Breyting</th>' : ""}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="note">Skekkjan e = r − y er reiknuð með raunverulegu mældu hitastigi, án viðbættrar truflunar. Breytingin er reiknuð á tölugildum: græn ör niður þýðir að endurbætta stýringin er betri. Engin prósenta er sýnd þegar báðar skekkjur eru undir 0,05 °C, sem er minna en upplausn nemans. H er fastur bútur og R er rampur.</p>
    ${dz ? `<h2 class="section-title">Stýringar</h2><div class="tablecard"><table><thead><tr><th>Útgáfa</th><th class="num">Kc [%/°C]</th><th class="num">Ti [s]</th><th class="num">tc [s]</th><th class="num">θ virkt [s]</th><th class="num">Forsýn [s]</th></tr></thead><tbody>${dz}</tbody></table></div>` : ""}`;

  document.getElementById("cb-settle").onchange = e => { state.showSettle = e.target.checked; render(); };
  const cm = document.getElementById("cb-meas"); if (cm) cm.onchange = e => { state.showMeas = e.target.checked; render(); };

  const src = v => state.showSettle ? runs[v].all : runs[v].run.map(r => ({ ...r, tt: r.t }));
  const ref = src(vers[0]);
  const sT = [{ name: "Óskgildi", color: C.sp, dash: "5 5", width: 1.5, pts: ref.map(r => [r.tt, r.r]) }], sU = [];
  const lg = [`<span style="color:${C.sp}"><i class="dash"></i><em>Óskgildi</em></span>`];
  vers.forEach(v => {
    const d = src(v);
    if (part === 3 && state.showMeas) sT.push({ name: "mæling", color: C[v], width: 1, opacity: .22, tip: false, pts: d.map(r => [r.tt, r.y_meas]) });
    sT.push({ name: VN[v], color: C[v], width: 2.2, endDot: true, pts: d.map(r => [r.tt, r.y]) });
    sU.push({ name: VN[v], color: C[v], width: 1.6, pts: d.map(r => [r.tt, r.u]) });
    lg.push(`<span style="color:${C[v]}"><i></i><em>${VN[v]}</em></span>`);
  });
  if (part === 3 && state.showMeas) lg.push(`<span style="color:var(--muted)"><i class="faint"></i><em>Mæling með truflun</em></span>`);
  document.getElementById("lg-T").innerHTML = lg.join("");
  const bands = segments(part).filter(s => s[0] === "ramp").map((s, i) => [s[1], s[2], i === 0 ? "Hækkun" : "Lækkun"]);
  if (state.showSettle) bands.unshift([-1e9, 0, "Aðlögun"]);
  lineChart(document.getElementById("ch-T"), { series: sT, height: 340, unit: " °C", xUnit: "s", bands, bandLabels: true, aria: "Hitastig og óskgildi" });
  lineChart(document.getElementById("ch-u"), { series: sU, height: 170, unit: "%", xUnit: "s", yMin: 0, yMax: 100, yTicks: 4, tipDigits: 1, bands, aria: "Duty cycle viftu" });
}

function fanTests() {
  return Object.keys(state.files).map(n => n.match(/^fan_test_([\d.]+)Hz\.csv$/)).filter(Boolean)
    .map(m => ({ name: m[0], hz: +m[1], rows: parseCSV(state.files[m[0]]) })).sort((a, b) => a.hz - b.hz);
}
const hzName = hz => hz >= 1000 ? `${+(hz / 1000).toFixed(2)} kHz` : `${hz} Hz`;

function renderFan(p) {
  const tests = fanTests();
  const hero = `<section class="hero"><span class="eyebrow">Viftupróf</span><h1>Svörun viftu</h1><p>Hitagjafinn er slökktur og snúningshraði viftunnar mældur með Hall-nemanum fyrir hvert duty cycle, eitt próf fyrir hverja PWM tíðni.</p>${sourceLine()}</section>`;
  if (!tests.length) { p.innerHTML = hero + emptyState("Engin viftupróf", `Hlaðið inn <span class="mono">fan_test_1000Hz.csv</span> eða sambærilegum skrám.`); return; }
  const cols = ["--v1", "--v2", "--sp", "--good"];
  const color = i => css(cols[i % cols.length]);
  const duties = [...new Set(tests.flatMap(t => t.rows.map(r => r.duty)))].sort((a, b) => a - b);
  const legend = tests.map((t, i) => `<span style="color:${color(i)}"><i></i><em>${hzName(t.hz)}</em></span>`).join("");
  const head = tests.map(t => `<th class="num">${hzName(t.hz)} [rpm]</th>`).join("");
  const body = duties.map(d => `<tr><td class="name">${d}%</td>${tests.map(t => { const r = t.rows.find(x => x.duty === d); return `<td class="num">${r ? fmt(r.rpm, 0) : "–"}</td>`; }).join("")}</tr>`).join("");
  p.innerHTML = hero + `
    <div class="card"><div class="card-head"><h3>Snúningshraði eftir duty cycle</h3><div class="legend">${legend}</div></div><div class="chart" id="ch-fan"></div></div>
    <h2 class="section-title">Mælingar</h2><div class="tablecard"><table><thead><tr><th>Duty</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="note">Hver lína er ein PWM tíðni. Línurnar sýna hvort viftan svarar duty cycle línulega og hvort tíðnin hafi áhrif á lágmarks- og hámarkshraða.</p>`;
  lineChart(document.getElementById("ch-fan"), { series: tests.map((t, i) => ({ name: hzName(t.hz), color: color(i), width: 2, pts: t.rows.map(r => [r.duty, r.rpm]) })), height: 340, unit: " rpm", xUnit: "%", xName: "duty", yMin: 0, tipDigits: 0, aria: "Snúningshraði viftu eftir duty cycle" });
}

function renderEq(p) {
  const txt = state.files["step1_equilibrium.csv"];
  const hero = `<section class="hero"><span class="eyebrow">Liður 1B</span><h1>Jafnvægishitastig</h1><p>Hitagjafinn er í gangi og viftan keyrð á 20%, 50% og 80% duty cycle í röð. Jafnvægi telst náð þegar hallatala síðustu 120 sekúndna fer undir 0,1 °C á mínútu.</p>${sourceLine()}</section>`;
  if (!txt) { p.innerHTML = hero + emptyState("Engar jafnvægismælingar", `Hlaðið inn <span class="mono">step1_equilibrium.csv</span> og helst <span class="mono">model.json</span>.`); return; }
  const rows = parseCSV(txt), levels = [];
  rows.forEach(r => { if (!levels.length || levels[levels.length - 1].duty !== r.duty) levels.push({ duty: r.duty, rows: [] }); levels[levels.length - 1].rows.push(r); });
  levels.forEach(l => { const tEnd = l.rows[l.rows.length - 1].t; l.T = mean(l.rows.filter(r => r.t >= tEnd - 120).map(r => r.temp)); l.t0 = l.rows[0].t; l.t1 = tEnd; });
  let model = null; try { model = state.files["model.json"] ? JSON.parse(state.files["model.json"]) : null; } catch {}
  const tfor = d => { const mt = model && model.levels ? model.levels.find(x => x.duty === d) : null; const l = levels.find(x => x.duty === d); return mt ? mt.T_eq : l ? l.T : NaN; };
  const facts = [20, 50, 80].map(d => `<div class="kpi"><span class="k">Vifta á ${d}%</span><span class="big">${fmt(tfor(d), 2)}<small>°C</small></span><span class="sub">T${d}</span></div>`).join("")
    + (model && model.noise_amp != null ? `<div class="kpi"><span class="k">Truflun í lið 3</span><span class="big">±${fmt(model.noise_amp, 3)}<small>°C</small></span><span class="sub">3% af |T20 − T80|, 8 s</span></div>` : "");
  const eqRows = levels.map(l => {
    const mt = model && model.levels ? model.levels.find(x => x.duty === l.duty) : null;
    return `<tr><td class="name">${l.duty}%</td><td class="num">${fmt(l.T, 2)}</td><td class="num">${mt ? fmt(mt.T_expfit, 2) : "–"}</td><td class="num"><b>${mt ? fmt(mt.T_eq, 2) : "–"}</b></td><td class="num">${fmt(l.t1 - l.t0, 0)}</td></tr>`;
  }).join("");
  const stepRows = model && model.steps ? model.steps.map(s => `<tr><td class="name">${s.name.replace("->", " → ")} %</td><td class="num">${fmt(s.K, 4)}</td><td class="num">${fmt(s.tau, 1)}</td><td class="num">${fmt(s.theta, 1)}</td><td class="num">${fmt(s.fit && s.fit.Q, 2)}</td><td class="num">${fmt(s.fit && s.fit.n1.rms, 3)}</td></tr>`).join("") : "";
  p.innerHTML = hero + `
    <div class="kpis">${facts}</div>
    <div class="card"><div class="card-head"><h3>Hitastig</h3><div class="legend"><span style="color:${css("--v2")}"><i></i><em>Mælt hitastig</em></span><span style="color:${css("--sp")}"><i class="dash"></i><em>Jafnvægishiti</em></span></div></div><div class="chart" id="ch-eqT"></div></div>
    <div class="card"><div class="card-head"><h3>Duty cycle viftu</h3></div><div class="chart" id="ch-equ"></div></div>
    <div class="grid2">
      <div><h2 class="section-title">Jafnvægi</h2><div class="tablecard"><table><thead><tr><th>Duty</th><th class="num">Hali [°C]</th><th class="num">Veldisspá [°C]</th><th class="num">Valið [°C]</th><th class="num">Lengd [s]</th></tr></thead><tbody>${eqRows}</tbody></table></div></div>
      <div><h2 class="section-title">Yfirfærslufall</h2>${stepRows ? `<div class="tablecard"><table><thead><tr><th>Þrep</th><th class="num">K [°C/%]</th><th class="num">τ [s]</th><th class="num">θ [s]</th><th class="num">Q</th><th class="num">RMS [°C]</th></tr></thead><tbody>${stepRows}</tbody></table></div>` : emptyState("Ekkert líkan", `Hlaðið inn <span class="mono">model.json</span>.`)}</div>
    </div>
    <p class="note">Hali er meðaltal síðustu 120 sekúndna. Veldisspáin er lokagildi fyrstu gráðu líkans sem er aðlagað að þrepinu. Líkanið G(s) = K e<sup>−θs</sup>/(τs + 1) er metið með t<sub>1/3</sub> og t<sub>2/3</sub> aðferðinni.</p>`;
  const series = [{ name: "Hitastig", color: css("--v2"), width: 2, pts: rows.map(r => [r.t, r.temp]) }];
  levels.forEach(l => series.push({ name: `T_eq ${l.duty}%`, color: css("--sp"), dash: "5 5", width: 1.3, tip: false, pts: [[l.t0, l.T], [l.t1, l.T]] }));
  lineChart(document.getElementById("ch-eqT"), { series, height: 340, unit: " °C", xUnit: "s", aria: "Hitastig í jafnvægismælingu" });
  lineChart(document.getElementById("ch-equ"), { series: [{ name: "Duty", color: css("--accent"), step: true, width: 2, pts: rows.map(r => [r.t, r.duty]) }], height: 150, yMin: 0, yMax: 100, yTicks: 4, unit: "%", xUnit: "s", tipDigits: 0, aria: "Duty cycle" });
}

// ---------------------------------------------------------------- skráainnlestur
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
// Vafrar endurnefna niðurhal ("step1_equilibrium (1).csv", "..._1.csv") og fólk bætir við
// viðskeytum ("..._25kHz.csv"). Mælaborðið flettir upp eftir nákvæmu nafni, svo nafninu er
// varpað á staðlað form út frá nafninu sjálfu eða, ef það dugar ekki, haus/innihaldi skrárinnar.
function canonicalName(name, txt) {
  const low = name.toLowerCase();
  let m = low.match(/part\s*(\d)[ _-]*(v\d)/);
  if (m) return `part${m[1]}_${m[2]}` + (/design/.test(low) || /\.json$/.test(low) ? "_design.json" : ".csv");
  if (/step1|equilibrium/.test(low) && /\.csv$/.test(low)) return "step1_equilibrium.csv";
  if (/model/.test(low) && /\.json$/.test(low)) return "model.json";
  if (/\.csv$/.test(low)) {
    const head = (txt.split(/\r?\n/, 1)[0] || "").split(",").map(h => h.trim());
    if (["t", "duty", "temp"].every(h => head.includes(h)) && !head.includes("phase")) return "step1_equilibrium.csv";
  } else {
    try { const j = JSON.parse(txt); if (j && (j.levels || j.steps)) return "model.json"; } catch {}
  }
  return name;
}
async function addFiles(list) {
  const got = [];
  for (const f of list) {
    if (!/\.(csv|json)$/i.test(f.name)) continue;
    if (!state.dropped) { state.files = {}; state.real = true; state.dropped = true; }
    const txt = await f.text();
    state.files[canonicalName(f.name.replace(/^.*[\\/]/, ""), txt)] = txt; got.push(f.name);
  }
  if (!got.length) { toast("Engar CSV eða JSON skrár fundust."); return; }
  state.label = `${Object.keys(state.files).length} skrár`;
  toast(`${got.length} ${got.length === 1 ? "skrá lesin" : "skrár lesnar"}`);
  const m = got.join(" ").match(/part(\d)_/); if (m) state.tab = "p" + m[1]; else if (got.some(n => /fan_test/i.test(n))) state.tab = "fan"; else if (state.files["step1_equilibrium.csv"] || state.files["model.json"]) state.tab = "eq";
  render();
}
const fileIn = document.getElementById("file"), dropEl = document.getElementById("dropzone");
document.getElementById("pick").onclick = () => fileIn.click();
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value = ""; };
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; dropEl.hidden = false; });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.hidden = true; } });
document.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; dropEl.hidden = true; if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", render);

loadEmbedded();
let savedTheme = "light";
try { savedTheme = localStorage.getItem("theme") || "light"; const t = localStorage.getItem("tab"); if (t && TABS.some(x => x[0] === t)) state.tab = t; } catch {}
applyTheme(savedTheme);
renderTheme();
render();
</script>
